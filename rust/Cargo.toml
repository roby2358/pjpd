[package]
name = "pjpd"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
fastrand = "2.5.0"
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
